<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Travel Easy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Jean Louis Schnaider">
    <meta name="description"
        content="Welcome to travel Easy. Travel Easy simplify the process of planning a trip. Keep tracks of your destinations, budgets together in one place, making trip planning more organized and less stressful.">
    <link rel="icon" href="images/travel-easy.ico">
    <link rel="stylesheet" href="styles/index.css">
    <script type="module" src="scripts/contact.js"></script>

</head>

<body>
    <!-- Header placeholder -->
    <div class="header"></div>

    <main class="contact-page">
        <h1>Contact Us</h1>

        <!-- Contact Form -->

        <div class="contact-container">
            <form id="contactForm">
                <label for="contactName">Name</label>
                <input type="text" id="contactName" required>
            
                <label for="contactEmail">Email</label>
                <input type="email" id="contactEmail" required>
            
                <label for="contactMessage">Message</label>
                <textarea id="contactMessage" required></textarea>
            
                <button type="submit">Send</button>

                <p id="contactStatus"></p>

            </form>
            
            <!-- Contact Sections -->
            <div class="contact-extra">
                <section class="contact-info">
                    <h2>Our Office</h2>
                    <p>Travel Easy HQ<br>
                        Lillavois, Port-au-Prince, Haiti</p>
                    <p>Email: support@traveleasy.com<br>
                        Phone: +509 555 1234</p>
                </section>
            
                <section class="map">
                    <h2>Find Us</h2>
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7561.796623543839!2d-72.23455044557936!3d18.62364300688566!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sfr!2sht!4v1771256195654!5m2!1sfr!2sht"
                        style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </section>
            </div>
        </div>

    </main>

    <!-- Footer placeholder -->
    <div class="footer"></div>

</body>

</html>
