<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Easy - Destinations</title>
    <meta name="author" content="Jean Louis Schnaider" />
    <meta
      name="description"
      content="Travel Easy simplify the process of planning a trip. You can Look for your next destination here. Find every city here."
    />
    <link rel="icon" href="images/travel-easy.ico" />
    <link rel="stylesheet" href="styles/index.css" />
    <script type="module" src="scripts/destinations.js" defer></script>
  </head>

  <body>
    <!-- HEADER -->
    <header class="header"></header>

    <!-- HERO -->
    <section class="hero-small">
      <div class="explore-text">
        <h1>Explore Attractions</h1>
        <p>Discover museums, parks, and historic sites</p>
        <p>Type the name of a city to explore</p>
      </div>
      <form id="exploreForm" class="explore-form">
        <input type="text" id="city" placeholder="Enter a city" required />
        <button type="submit">Explore</button>
      </form>
    </section>

    <!-- SEARCH RESULTS -->
    <section class="features">
      <h2>Your Search</h2>
      <div id="attractionsGrid">
        <p>Nothing here yet...</p>
      </div>
    </section>

    <!-- FEATURED DESTINATIONS -->
    <section class="features">
      <h2>Featured Destinations</h2>
      <div class="spotlight-grid" id="featuredDestinations"></div>
    </section>

    <!-- FOOTER -->
    <footer class="footer"></footer>
  </body>
</html>
